# Auto-Ontology agent gateway — Cloudflare Workers + Containers.
#
#   - Worker authenticates the frontend server and routes by authenticated user
#     to that user's Durable Object (AGENT_DO).
#   - The DO starts the Python API Container and streams its responses.
#
# Runtime credentials belong in Wrangler secrets; non-secret settings use vars.

name = "auto-ontology-agent-gateway"
main = "./src/agent-gateway.ts"
compatibility_date = "2026-11-13"

[observability]
  enabled = true

  [observability.traces]
    enabled = true

# --- Agent Container image -------------------------------------------------
[[containers]]
  class_name = "AgentDo"
  scheduling_policy = "durable_object"

  [containers.images.base]
    dockerfile = "../Dockerfile"

  [containers.observability]
    enabled = true
    target_instance_percentage = 25

# --- Per-user Durable Object -----------------------------------------------
# One DO and Container per authenticated user, keyed by the Worker.
[[durable_objects.bindings]]
  name = "AGENT_DO"
  class_name = "AgentDo"

# --- Exports ---------------------------------------------------------------
# The per-user gateway Durable Object owns its Container and SQLite state.
[exports.AgentDo]
  type = "durable-object"
  storage = "sqlite"

# --- Runtime config (override with wrangler secret put) -------------------
[vars]
  # Container instance size.
  CONTAINER_INSTANCE_TYPE = "standard-1"
  # Python FastAPI port from Dockerfile.
  AGENT_PORT = "3001"
  # Agent needs outbound access for external model/prediction APIs.
  CONTAINER_ENABLE_INTERNET = "true"
  # Enable backend SSO-token handling only when frontend passes validated tokens.
  ANY_CONNECTION_USES_SSO_FEDERATION = "false"
  # Comma-separated secret or var binding names forwarded to Python Container.
  #   - AURORA_*        : catalog DB connection (Phase 1 storage layer)
  #   - KUMO_RFM_API_KEY / KUMO_RFM_API_URL : Kumo RFM prediction (URL is
  #                         required by the predictor; omit to disable Kumo)
  #   - DEFAULT_MODELS_API_KEY : shared fallback for every LLM/embedding triplet
  #   - REASONING/NON_REASONING/EMBED/RERANK_API_KEY : per-triplet overrides
  #     (optional; each falls back to DEFAULT_MODELS_API_KEY). Endpoints and
  #     models fall back to built-in NVAPI defaults, or set DEFAULT_MODELS_*.
  CONTAINER_ENV_SECRETS = "ANY_CONNECTION_USES_SSO_FEDERATION,AURORA_HOST,AURORA_PORT,AURORA_USER,AURORA_PASSWORD,AURORA_DATABASE,AURORA_SSL_ROOT_CERT,KUMO_RFM_API_KEY,KUMO_RFM_API_URL,DEFAULT_MODELS_API_KEY,REASONING_API_KEY,NON_REASONING_API_KEY,EMBED_API_KEY,RERANK_API_KEY"
